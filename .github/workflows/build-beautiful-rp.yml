name: Build Let's Do Beautiful resource pack

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Encrypt RP and build mcaddon
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Preserve source pack outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bedrock-source"
          cp -a "Let'sDoBeautifulRP" "$RUNNER_TEMP/bedrock-source/"

      - name: Validate encryption key
        shell: bash
        env:
          BEDROCK_TEXTUREPACK_KEY: ${{ secrets.BEDROCK_TEXTUREPACK_KEY }}
        run: |
          if [[ ! "$BEDROCK_TEXTUREPACK_KEY" =~ ^[A-Za-z0-9]{32}$ ]]; then
            echo "Set repository secret BEDROCK_TEXTUREPACK_KEY to a 32-character alphanumeric key."
            exit 1
          fi

      - name: Encrypt Beautiful resource pack
        uses: ./.github/actions/encrypt-bedrock-pack
        with:
          pack-path: ${{ runner.temp }}/bedrock-source/Let'sDoBeautifulRP
          mcpack-output: ${{ runner.temp }}/encrypted/LetsDoBeautifulRP.mcpack
          key-file: ${{ runner.temp }}/keys/LetsDoBeautifulRP.mcpack.key
          encryption-key: ${{ secrets.BEDROCK_TEXTUREPACK_KEY }}

      - name: Stage encrypted resource pack in addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ma-LetsDoBeautiful"
          unzip -tq "$RUNNER_TEMP/encrypted/LetsDoBeautifulRP.mcpack"
          cp "$RUNNER_TEMP/encrypted/LetsDoBeautifulRP.mcpack" "$GITHUB_WORKSPACE/ma-LetsDoBeautiful/LetsDoBeautifulRP.mcpack"

      - name: Package .mcaddon
        uses: Fabrimat/addon-packager-action@1f3c23b7443e9886d1cada725eeac54e9b734c57

      - name: Create or reuse GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              exit 0
            fi
            if gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Could not create or find GitHub Release $RELEASE_TAG" >&2
          exit 1

      - name: Upload .mcaddon to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" LetsDoBeautiful.mcaddon --clobber

      - name: Upload build artifact for non-release runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: LetsDoBeautiful-mcaddon
          path: LetsDoBeautiful.mcaddon
          if-no-files-found: error
          compression-level: 0
